name: Auto Tag
on:
  push:
    branches: [main]
permissions: {}
jobs:
  auto-tag:
    # Job-level grant, so nothing else in this file gets write access.
    permissions:
      contents: write # push the version tag
    uses: smartwatermelon/github-workflows/.github/workflows/auto-tag.yml@auto-tag-v1
