# Gate routing rules. First match wins.
# Format: <matcher> <outcome>
#   matcher: repo=<owner/name> | author=<login> | owner=<login> | fork=<login> |
#            private=<login> | *
#   outcome: pangram | visual | exempt
# Repo, author and owner values are matched case-insensitively.
# owner=<login> matches the owner part of owner/name exactly, and only when the
# host is github.com. A gh -R owner/name, repos/<o>/<n> path or github.com URL
# counts as github.com; a checkout's origin must name github.com itself.
# fork=<login> is owner=<login> plus GitHub's `fork` field. An unknown answer
# never matches.
# private=<login> is owner=<login> plus GitHub's `private` field. An unknown
# answer (lookup failed, no access) never matches. Answers are cached for one
# day, so a repo made public can stay exempt for up to a day.
# fork= and private= need a GitHub lookup. Every other rule below the first
# of them must be gated (it is), so a failed lookup lands on a gated rule.
#
# Decided by Andrew 2026-10-08 (dev-env#154): the gate protects his job and
# public writing, not personal work nobody else reads.
#
# Exempt: beacon-workspace is his private Beacon notes repo.
repo=andrewmrich/beacon-workspace exempt
# The public sites' pages are gated by copy-paths.conf, not here: their commit
# and PR text is internal (Andrew, 2026-10-15).
# Exempt: the personal owners (twistedmelonman non-fork repos: Andrew, 2026-10-08).
# gh text posted from a fork checkout with no -R may go to the parent, so it takes
# the stricter of the origin's route and `*` (gate-route --publish).
owner=smartwatermelon exempt
owner=twistedmelonman exempt
# NOS too, client sites included: only Beacon's internal text is gated (Andrew, 2026-10-15).
# This sits above author=andrewmrich, so his Beacon login is exempt in NOS repos as here.
owner=nightowlstudiollc exempt
# Exempt: text inside a fork under his Beacon owners.
fork=beacon-biosignals exempt
fork=andrewmrich exempt
# Gated: Beacon (his job), private or not.
author=andrewmrich pangram
owner=beacon-biosignals pangram
owner=andrewmrich pangram
# Known limit: gh api calls naming no repos/<o>/<n> (gists, team discussions) route by the checkout.
# Known limit: gh api --hostname and GH_HOST are not detected; -R owner/name is taken as github.com.
* visual
