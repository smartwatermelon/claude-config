# Public-facing copy: files whose text ships to people outside the repo.
# Read by scripts/gate-copy.py, called from hook-block-personify.sh on every
# agent `git commit`. When staged changes touch a path listed here, the added or
# changed text goes through Pangram and Andrew's approval, whatever route
# gate-rules.conf gives the commit message (dev-env#206 part B, decided
# 2026-10-15; design in dev-env docs/superpowers/specs/2026-10-15-copy-gate-design.md).
#
# Format: <owner/name> <include|exclude> <glob>
#   Globs match the repo-relative path. `*` and `?` stay inside one directory,
#   `**` crosses directories, `**/` also matches no directory at all.
#   A path is copy when an include matches and no exclude does.
#   A repo with no lines here has no copy paths (opt-in per repo).
#
# Keep includes explicit. A loose `**/*.html` also catches generated and
# vendored files. Phase 2 (in-app JSX strings in kebab-tax) is not here.

# kebab.tax web site, emails, and the release notes the app's What's New shows.
nightowlstudiollc/kebab-tax-netlify include *.html
nightowlstudiollc/kebab-tax-netlify include emails/*.html
nightowlstudiollc/kebab-tax-netlify include release-notes.json
nightowlstudiollc/kebab-tax-netlify include APP_STORE_COPY.txt
nightowlstudiollc/kebab-tax-netlify include MARKETING_POSTS.md

# Kebab app: store listings and email copy. Not mobile/src (phase 2).
nightowlstudiollc/kebab-tax include mobile/fastlane/metadata/**/*.txt
nightowlstudiollc/kebab-tax exclude mobile/fastlane/metadata/**/*_url.txt
nightowlstudiollc/kebab-tax include docs/mobile/APP_STORE_COPY.md
nightowlstudiollc/kebab-tax include docs/promo-email-templates.md
nightowlstudiollc/kebab-tax include docs/beta-tester-thank-you-email.md

# nightowlstudio.us
nightowlstudiollc/night-owl-studio include index.html
nightowlstudiollc/night-owl-studio include local-websites.html
nightowlstudiollc/night-owl-studio include privacy.html
nightowlstudiollc/night-owl-studio include success.html
nightowlstudiollc/night-owl-studio include proposals/*.html

# projectinsomnia
smartwatermelon/projectinsomnia include src/content/blog/**
smartwatermelon/projectinsomnia include src/content/elections/**
smartwatermelon/projectinsomnia include src/content/ouatrevisit/**
smartwatermelon/projectinsomnia include src/pages/*.astro
smartwatermelon/projectinsomnia include src/data/friends.json

# crazy-larry
smartwatermelon/crazy-larry include index.html

# Client sites: gated the same way, for agent commits only (decision 3).
nightowlstudiollc/tnjcleaning include index.html
nightowlstudiollc/tnjcleaning include privacy.html
nightowlstudiollc/tnjcleaning include terms.html
nightowlstudiollc/tnjcleaning include thank-you.html

nightowlstudiollc/amelia-boone include src/data/blog/**
nightowlstudiollc/amelia-boone include src/pages/about.md
nightowlstudiollc/amelia-boone include src/pages/*.astro
nightowlstudiollc/amelia-boone include src/drafts/**
nightowlstudiollc/amelia-boone exclude public/pagefind/**
