# Merge-lock policy: how each PR merges. First match wins.
# Format: <matcher> <outcome>
#   matcher: repo=<owner/name> | owner=<login> | author=<login> | *
#   outcome: lock | exempt | refuse | review
#     lock:   an agent's gh pr merge needs Andrew's merge-lock first.
#     exempt: no lock; green CI and pre-merge-review.sh still apply.
#     refuse: agents never merge it. No prompt, and an existing lock does not
#             override it. Andrew merges in the GitHub UI after the repo's
#             own approval process.
#     review: Andrew's approving GitHub review is the lock. The merge needs
#             his approval on the current head commit, and a ruleset on the
#             base branch that requires review of the last push. A lock file
#             does not count. Green CI and pre-merge-review.sh still apply.
#             hook-block-pr-approve.sh keeps the agent's Bash tool from
#             approving. Not covered: a browser click as Andrew (Claude in
#             Chrome, computer use) while that agent-identity condition is open.
# If the policy cannot be read or gives no clear lock or exempt answer, the
# merge is treated as refuse, and no lock overrides that.
# Values match case-insensitively. author= is the PR author's GitHub login.
#
# Decided by Andrew 2026-10-08 (dev-env#176): "merge-locks protect critical
# infrastructure but allow everyday work to go through." An exempt PR still
# needs green CI and pre-merge-review.sh; only the human lock step goes.
#
# merge-lock.sh reads this file from the claude-config checkout's local main
# (git show refs/heads/main:merge-lock-policy.conf, with main contained in
# origin/main), never from the working tree or the checked-out branch, so
# an edit counts only after a reviewed PR into claude-config merges. That PR
# is itself locked (the claude-config rule below).

# Exempt: Andrew's private Beacon notes repo, whoever authored the PR.
repo=andrewmrich/beacon-workspace exempt
# Refused: every beacon-biosignals repo, whoever authored the PR. A peer
# approves on GitHub and Andrew merges in the GitHub UI (decided 2026-10-26).
# It sits above the author rule so an andrewmrich-authored PR here is refused,
# not locked.
owner=beacon-biosignals refuse
# Locked: anything the andrewmrich (Beacon) account authored, in any repo.
author=andrewmrich lock
# Locked: the guardrails and what reaches every fleet repo.
repo=smartwatermelon/claude-config lock
repo=smartwatermelon/dotfiles lock
repo=smartwatermelon/github-workflows lock
# Review: the agent-identity pilot (claude-config#659). Agent pushes go as the
# smartwatermelon-agent App, and the main ruleset requires Andrew's approval
# of the last push, so his GitHub approval is the lock (decided 2026-11-02).
repo=smartwatermelon/claude-wrapper review
# Locked: public Netlify sites (dev-env site-monitor sites.json).
repo=smartwatermelon/projectinsomnia lock
repo=smartwatermelon/crazy-larry lock
# Locked: nightowlstudiollc. OPEN DECISION (Andrew, 2026-10-08): the NOS lock
# is undecided. It exists because dangerous mistakes were committed and merged
# during early kebab-tax development. Stays locked until he decides; change
# only this line.
owner=nightowlstudiollc lock
# Exempt: everything else, including twistedmelonman non-fork repos.
* exempt
