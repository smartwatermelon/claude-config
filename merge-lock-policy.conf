# Merge-lock policy: which PRs need Andrew's merge-lock. First match wins.
# Format: <matcher> <outcome>
#   matcher: repo=<owner/name> | owner=<login> | author=<login> | *
#   outcome: lock | exempt
# Values match case-insensitively. author= is the PR author's GitHub login.
#
# Decided by Andrew 2026-10-08 (dev-env#176): "merge-locks protect critical
# infrastructure but allow everyday work to go through." An exempt PR still
# needs green CI and pre-merge-review.sh; only the human lock step goes.
#
# merge-lock.sh reads this file from the claude-config checkout's committed
# main (git show HEAD:merge-lock-policy.conf), never from the working tree, so
# an edit counts only after a reviewed PR into claude-config merges. That PR
# is itself locked (rule 3).

# Exempt: Andrew's private Beacon notes repo, whoever authored the PR.
repo=andrewmrich/beacon-workspace exempt
# Locked: anything the andrewmrich (Beacon) account authored, in any repo.
author=andrewmrich lock
# Locked: the guardrails and what reaches every fleet repo.
repo=smartwatermelon/claude-config lock
repo=smartwatermelon/dotfiles lock
repo=smartwatermelon/github-workflows lock
repo=smartwatermelon/claude-wrapper lock
# Locked: public Netlify sites (dev-env site-monitor sites.json).
repo=smartwatermelon/projectinsomnia lock
repo=smartwatermelon/crazy-larry lock
# Locked: every beacon-biosignals repo.
owner=beacon-biosignals lock
# Locked: nightowlstudiollc. OPEN DECISION (Andrew, 2026-10-08): the NOS lock
# is undecided. It exists because dangerous mistakes were committed and merged
# during early kebab-tax development. Stays locked until he decides; change
# only this line.
owner=nightowlstudiollc lock
# Exempt: everything else, including twistedmelonman non-fork repos.
* exempt
