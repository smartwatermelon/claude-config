# Vale config for gate-lint.sh (scripts/gate-lint.sh). Always passed with an
# explicit --config: a bare `vale` walks up from the cwd for a .vale.ini, and
# past the repo root it falls back to Vale's defaults, so the rules below
# would silently not run (the same trap as markdownlint-cli2's config lookup).
#
# StylesPath is relative to this file. MinAlertLevel is suggestion so the
# warning-level Contractions rule is reported at all.
StylesPath = styles
MinAlertLevel = suggestion

# [*], not [*.md]: gate-lint passes --ext=.md, and every gated text is
# Markdown-ish (commit messages, PR bodies, comments).
[*]
BasedOnStyles = Andrew
