name: Claude Blocking Review

# `claude-review` pins Sonnet 5.5 (the reusable workflow's default is still
# Sonnet 4.6). A second job, `claude-review-haiku`, used to run the same
# review on Haiku 4.5 as a non-required A/B comparison. It was removed on
# 2026-09-30: Haiku 4.5 made repeated false BLOCKING findings. Re-add a Haiku
# job, serialized with `needs: claude-review` and `if: always()` so the two
# do not race on the PR comment (issue #162), when Haiku 5.5 ships.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    uses: smartwatermelon/github-workflows/.github/workflows/claude-blocking-review.yml@v3
    with:
      pr_number: ${{ github.event.pull_request.number }}
      model: "claude-sonnet-5-5"
    secrets:
      claude_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
